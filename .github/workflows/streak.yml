name: Update streak card

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/streak.mjs
      - .github/workflows/streak.yml

permissions:
  contents: write

concurrency:
  group: streak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate cards
        run: node scripts/streak.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git add assets/streak-dark.svg assets/streak-light.svg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update streak card"
          git push
